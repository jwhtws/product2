name: 식당 개업·폐업 변경 이력

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurant-change-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 관리자 저장소 받기
        uses: actions/checkout@v4

      - name: 식당 데이터 저장소 받기
        run: git clone --depth 20 https://github.com/jwhtws/product1.git /tmp/product1

      - name: 일자별 추가·제거 식당 비교
        run: node scripts/build-restaurant-change-history.mjs /tmp/product1 data/restaurant-change-history.json

      - name: 변경 이력 저장
        run: |
          if git diff --quiet -- data/restaurant-change-history.json && git ls-files --error-unmatch data/restaurant-change-history.json >/dev/null 2>&1; then
            echo "새로운 식당 변경 이력이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurant-change-history.json
          git commit -m "data: 식당 개업·폐업 변경 이력 갱신"
          git push
