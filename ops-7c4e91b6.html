  <div id="admin-login" class="login-screen">

      <a href="https://product1-84t.pages.dev/" class="admin-brand">mukdang<span>.com</span></a>
      <p class="overline">ADMIN CONSOLE</p>

      <p class="overline">ADMIN CONSOLE</p>
      <nav>
        <button class="active" data-view="dashboard">대시보드</button>
        <button data-view="tasks">해야 할 일</button>
        <button data-view="analytics">데이터 분석</button>

        <button id="menu-toggle" aria-label="관리 메뉴">☰</button>
